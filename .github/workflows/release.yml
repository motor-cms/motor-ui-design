name: Release (Pre-release)

on:
  push:
    branches: [staging, develop]
    paths:
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: release-prerelease-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # git push version bump / tags (GITHUB_TOKEN)
  id-token: write   # OIDC -> npm trusted publishing (no stored NPM_TOKEN)

jobs:
  prerelease:
    name: Publish Pre-release
    runs-on: ubuntu-latest

    # Skip bot commits (merge-downs, version bumps)
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !startsWith(github.event.head_commit.message, 'Merge remote-tracking branch')

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # the token build test and the parity harness tests render in Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and test
        run: pnpm test

      # --- Decide whether to release ---
      # Only an author-written changeset releases. This workflow never writes
      # one (a stale auto changeset caused the 409 on 3.0.0-rc.0 in
      # motor-adminfrontend-zeitraumdev, 2026-09-30).
      - name: Check for changesets
        id: changesets
        run: |
          CHANGESETS=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | head -1)
          if [ -n "$CHANGESETS" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      # Second guard behind the `paths:` filter: packages/ must differ from the
      # last release tag. The tag comes from `git tag --list`, never from
      # `git describe` (which finds the nearest tag of any kind).
      - name: Check packages changed since last release tag
        id: pkgs
        run: |
          LAST_TAG=$(git tag --list '@motor-cms/ui-design-*' --sort=-creatordate | head -1)
          CHANGED=true
          if [ -n "$LAST_TAG" ]; then
            echo "Last release tag: $LAST_TAG"
            if ! git diff --name-only "$LAST_TAG"..HEAD -- 'packages/' | grep -q .; then
              CHANGED=false
            fi
          else
            echo "No release tag yet"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.changesets.outputs.has_changesets != 'true' || steps.pkgs.outputs.changed != 'true'
        run: echo "No author-written changeset, or no package change since the last release tag. Nothing to publish."

      - name: Determine pre-release tag
        if: steps.changesets.outputs.has_changesets == 'true' && steps.pkgs.outputs.changed == 'true'
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.changesets.outputs.has_changesets == 'true' && steps.pkgs.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Enter pre-release mode
        if: steps.changesets.outputs.has_changesets == 'true' && steps.pkgs.outputs.changed == 'true'
        run: |
          # Exit any existing pre-release mode first
          if [ -f .changeset/pre.json ]; then
            pnpm changeset pre exit || true
          fi
          pnpm changeset pre enter ${{ steps.tag.outputs.tag }}
          # Clear consumed changesets so they get re-processed with the new tag
          if [ -f .changeset/pre.json ]; then
            node -e "
              const fs = require('fs');
              const f = '.changeset/pre.json';
              try {
                const p = JSON.parse(fs.readFileSync(f, 'utf8'));
                p.changesets = [];
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              } catch (e) {
                console.error('Failed to clear changesets:', e.message);
                process.exit(1);
              }
            "
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true' && steps.pkgs.outputs.changed == 'true'
        id: version
        run: |
          pnpm changeset version
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      # Direct `pnpm publish` per package. We avoid `pnpm changeset publish`
      # because the changesets/pnpm-11/npm-10.9 combo silently returns
      # "E404 undefined". `pnpm publish` resolves `workspace:` ranges.
      - name: Publish to npm
        if: steps.version.outputs.versioned == 'true'
        id: publish
        run: |
          set -e
          FAILED=()
          for pkg in packages/*; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            echo "::group::Publishing $NAME@$VERSION (tag: ${{ steps.tag.outputs.tag }})"
            if ( cd "$pkg" && pnpm publish --access public --tag ${{ steps.tag.outputs.tag }} --no-git-checks ); then
              echo "ok $NAME@$VERSION"
            else
              echo "failed $NAME@$VERSION"
              FAILED+=("$NAME@$VERSION")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Packages failed to publish: ${FAILED[*]}"
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Commit version updates
        if: steps.publish.outputs.published == 'true'
        run: |
          pnpm install --lockfile-only || echo "::warning::Failed to update lockfile"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages (${{ steps.tag.outputs.tag }})"
            git push || { echo "::error::Failed to push version commit"; exit 1; }
          fi
